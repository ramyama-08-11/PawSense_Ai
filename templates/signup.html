<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – PAWSENSE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=4.0">
    <style>
        body { overflow: auto; background: var(--bg-main); }
        #bg-canvas { position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
        .auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; position:relative; z-index:1; }
        .auth-card {
            background: var(--bg-sidebar); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border-color); border-radius: 24px;
            padding: 40px 36px; width: 100%; max-width: 420px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.18);
            animation: cardIn .5s cubic-bezier(.4,0,.2,1);
        }
        @keyframes cardIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
        .auth-logo { text-align:center; margin-bottom:28px; }
        .auth-logo-icon { width:64px; height:64px; border-radius:20px; background:var(--gradient); display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:1.8rem; margin-bottom:14px; box-shadow:0 8px 24px rgba(59,130,246,.4); }
        .auth-logo h1 { font-size:1.7rem; font-weight:900; margin-bottom:4px; }
        .auth-logo p { color:var(--text-secondary); font-size:.9rem; }
        .gradient-text { background: var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .auth-error { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:#ef4444; padding:10px 14px; border-radius:10px; font-size:.88rem; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:.85rem; font-weight:600; margin-bottom:7px; color:var(--text-secondary); }
        .input-with-icon { position:relative; }
        .input-with-icon i { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text-secondary); font-size:.9rem; }
        .input-with-icon input { width:100%; padding:12px 14px 12px 38px; background:rgba(0,0,0,.04); border:1.5px solid var(--border-color); border-radius:12px; color:var(--text-primary); font-size:.95rem; outline:none; font-family:'Outfit',sans-serif; transition:border-color .2s, box-shadow .2s; }
        [data-theme="dark"] .input-with-icon input { background:rgba(255,255,255,.05); }
        .input-with-icon input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,.2); }
        .auth-btn { width:100%; margin-top:4px; }
        .divider { text-align:center; position:relative; color:var(--text-secondary); font-size:.82rem; margin:20px 0; }
        .divider::before,.divider::after { content:''; position:absolute; top:50%; width:calc(50% - 50px); height:1px; background:var(--border-color); }
        .divider::before { left:0; } .divider::after { right:0; }
        .social-btns { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
        .btn-social { display:flex; align-items:center; justify-content:center; gap:7px; padding:10px; border-radius:12px; border:1.5px solid var(--border-color); background:transparent; color:var(--text-primary); font-size:.88rem; font-weight:600; cursor:pointer; transition:all .2s; text-decoration:none; }
        .btn-social:hover { background:rgba(59,130,246,.08); border-color:var(--accent); }
        .btn-google { color:#ea4335; } .btn-facebook { color:#1877f2; } .btn-instagram { color:#e1306c; }
        .auth-footer { text-align:center; font-size:.87rem; color:var(--text-secondary); margin-top:20px; }
        .auth-footer a { color:var(--accent); font-weight:600; text-decoration:none; }
        .auth-footer a:hover { text-decoration:underline; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon"><i class="fas fa-paw"></i></div>
                <h1>Join <span class="gradient-text">Pawsense</span></h1>
                <p>Create an account to get started</p>
            </div>

            {% if error %}
            <div class="auth-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
            {% endif %}

            <form method="POST" action="/signup">
                <div class="form-group">
                    <label for="username">Choose Username</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" required placeholder="Pick a unique username">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Create Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" required placeholder="Make it secure">
                    </div>
                </div>
                <button type="submit" class="btn-primary auth-btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="divider">or continue with</div>
            <div class="social-btns">
                <a href="/auth/google/login" class="btn-social">
                    <i class="fab fa-google btn-google"></i> Google
                </a>
                <a href="/mock_social_login/facebook" class="btn-social">
                    <i class="fab fa-facebook btn-facebook"></i> Facebook
                </a>
                <a href="/mock_social_login/instagram" class="btn-social">
                    <i class="fab fa-instagram btn-instagram"></i> Instagram
                </a>
            </div>

            <p class="auth-footer">Already have an account? <a href="/login">Login here</a></p>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
            resize(); window.addEventListener('resize', resize);
            const orbs = [220,260,200,280].map(hue => ({
                x: Math.random()*innerWidth, y: Math.random()*innerHeight,
                r: 180+Math.random()*200, dx:(Math.random()-.5)*.4, dy:(Math.random()-.5)*.4, hue
            }));
            function draw() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                orbs.forEach(o => {
                    o.x+=o.dx; o.y+=o.dy;
                    if(o.x<-o.r) o.x=canvas.width+o.r; if(o.x>canvas.width+o.r) o.x=-o.r;
                    if(o.y<-o.r) o.y=canvas.height+o.r; if(o.y>canvas.height+o.r) o.y=-o.r;
                    const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
                    g.addColorStop(0,`hsla(${o.hue},80%,65%,0.12)`);
                    g.addColorStop(1,`hsla(${o.hue},80%,65%,0)`);
                    ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
                    ctx.fillStyle=g; ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
